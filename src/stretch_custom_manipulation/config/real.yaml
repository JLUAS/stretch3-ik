# Real robot parameters (domain 42).
/guarded_executor/executor:
  ros__parameters:
    collision_environment: primitive
    lift_only: false
    dry_run: false
    execution_enabled: true
    transport_test_mode: false
    base_motion_enabled: false
    diagnostic_error_to_warn_allowlist:
      - "stretch_driver: Pimu/Cliff"
    pimu_temperature_error_can_warn: true
    # Wrist accelerometer: the driver flags ax outside [8, 11] m/s^2 during
    # normal arm motion (7.8 and 11.7 measured 2026-11-06). Within these
    # bounds it is a WARN; beyond (impact, fall) it still blocks.
    wacc_error_can_warn: true
    # TESTING: widest the code allows (14.2 seen during a wrist turn).
    wacc_ax_min: 4.0
    wacc_ax_max: 16.0
    pimu_temperature_warn_max_c: 50.0
    cliff_range_min: -100.0
    cliff_range_max: 200.0
    use_sim_time: false
    joint_state_topic: /stretch/joint_states
    state_timeout: 0.5
    future_stamp_tolerance: 0.15
    base_frame: base_link
    tcp_frame: link_grasp_center
    trajectory_action: /stretch_controller/follow_joint_trajectory
    # Nominal floor for one direct segment; real durations come from the
    # velocity/acceleration limits below (minimum-time quintic).
    trajectory_duration: 1.0
    min_duration: 0.5
    max_duration: 30.0
    collision_planning:
      enabled: true
      octomap_topic: /perception/octomap_binary
      # Persistent map built while navigating; queried through /odom.
      map_frame: odom
      scene_freshness_timeout: 1.0
      # Unseen voxels are free (decision 2026-11-02): requiring full coverage
      # blocked every path through space the head camera cannot see.
      unknown_is_collision: false
      timeout: 3.0
      max_iterations: 4000
      step_size: 0.12
      edge_resolution: 0.01
      goal_bias: 0.10
      random_seed: 29
      shortcut_enabled: true
      shortcut_attempts: 200
      visualize_path: true
    lift_test_delta: 0.01
    # Order: lift, arm_extension, wrist_yaw, wrist_pitch, wrist_roll.
    # Commissioning: if tracking aborts, halve max_velocity/max_acceleration.
    max_delta: [0.30, 0.30, 1.5, 1.5, 1.5]
    # Lift slowed 2026-11-06: at 0.10 m/s it lagged 3.03 cm on a 46 cm climb and
    # tripped the 3 cm tracking limit (other joints stayed within ~1 cm).
    max_velocity: [0.06, 0.10, 0.6, 0.6, 0.6]
    max_acceleration: [0.08, 0.15, 1.5, 1.5, 1.5]
    # TESTING (uncalibrated robot, 2026-11-06): doubled, at the code caps.
    # Restore [0.03, 0.03, 0.15, 0.15, 0.15] once the robot is calibrated.
    tracking_error: [0.06, 0.06, 0.30, 0.30, 0.30]
    # Wrists: servos settle ~1 deg short under load (0.015 measured 2026-11-02).
    goal_tolerance: [0.0025, 0.0025, 0.03, 0.03, 0.03]
    start_drift: [0.001, 0.001, 0.005, 0.005, 0.005]
    dry_run_report_path: /tmp/stretch_guarded_executor_report.json

# Real gripper parameters (Stretch driver interface).
# The real gripper uses the Stretch driver's built-in gripper action.
# No sim_gripper node is started in real mode; the driver provides the action.

# Pick state machine parameters.
/pick_state_machine:
  ros__parameters:
    base_frame: base_link
    pregrasp_offset: 0.08
    retract_height: 0.10
    gripper_open_aperture: 0.10
    gripper_close_aperture: 0.0
    grasp_verify_threshold: -0.1
    state_timeout: 30.0
    ik_timeout: 10.0
    execution_timeout: 90.0
    gripper_action: /stretch_gripper_controller/gripper_action

# Place state machine parameters.
/place_state_machine:
  ros__parameters:
    base_frame: base_link
    retract_height: 0.10
    gripper_open_aperture: 0.10
    state_timeout: 30.0
    ik_timeout: 10.0
    execution_timeout: 90.0
    gripper_action: /stretch_gripper_controller/gripper_action

# Gripper aperture calibration, measured 2026-11-06 on stretch-se3-3075
# (~/grasp_gripper_calibrate.sh: real pad gap per driver gripper_aperture).
# The driver's linear model is wrong for this gripper: its "6 cm" opens 1.6 cm;
# its widest command (0.20) opens 9 cm (user-measured). Pads touch for every
# command <= 4 cm, so the table starts there; lower commands squeeze.
/gripper_bridge:
  ros__parameters:
    calibration_command:  [0.040, 0.060, 0.080, 0.100, 0.120, 0.200]
    calibration_reported: [0.0401, 0.0601, 0.0801, 0.1002, 0.1201, 0.2000]
    calibration_measured: [0.000, 0.016, 0.022, 0.040, 0.045, 0.090]

/grasp_mission:
  ros__parameters:
    max_aperture: 0.090  # widest measured pad gap (m)
